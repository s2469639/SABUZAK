{% extends "base.html" %}
{% block title %}품목별 유망시장 | FairMate{% endblock %}

{% block content %}
{# un_v6/templates/un_comtrade_dashboard.html의 ①~⑤(세계시장 현황·유망시장
   매트릭스·후보국별 상세·AI 분석)를 그대로 이식. <style>은
   static/css/un_dashboard.css로 옮기고 ".un-page" 아래로 스코프해서 app
   전역 디자인과 안 섞이게 했다. ⑥ 국가 상세 조사는 여기 없음 - 박람회
   상세 페이지의 "시장개요" 탭에서 그 박람회 국가 하나만 다룬다. #}
<link rel="stylesheet" href="{{ url_for('static', filename='css/un_dashboard.css') }}">
{% from "exhibition/_un_macros.html" import bar_chart, money, hbar_chart %}

<div class="page-header">
  <div>
    <h1>품목별 유망시장</h1>
    <p class="page-desc">UN Comtrade 통계로 분석한 해외 유망시장 추천정보 (KOTRA TriBig "품목별 유망시장"과 같은 구조).</p>
  </div>
  <a href="{{ url_for('mypage.index') }}" class="btn-secondary">← 내 제품 관리로</a>
</div>

<div class="un-page">
  <div class="card notice">
    HS코드를 입력하면 ①② 세계시장 현황 → ③ 유망시장 매트릭스 → ④ 후보국별 상세 → ⑤ AI 분석 순서로 한 화면에 보여줍니다.
  </div>

  <form method="post" id="main-form" class="card search-card">
    <div class="search-main">
      <span class="radio-static">HSCODE</span>
      <div class="hs-box">
        <span class="search-icon" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </span>
        <input type="text" name="hscode" id="hscode-input" placeholder="예: 1905.90" value="{{ hscode }}" maxlength="7" required aria-label="HS코드(6자리)">
      </div>
      {% set bar_desc = item_desc_ko or (result.official_item_desc if result else '') %}
      <div class="item-name" title="{{ bar_desc }}">{{ bar_desc if bar_desc else 'HS코드(6자리)를 입력하고 통합분석을 눌러주세요' }}</div>
      <button type="submit" id="submit-btn" class="btn">통합분석</button>
    </div>
    <div class="search-options">
      <div class="opt">
        <label class="field-label" for="top-n-input">비교 국가 수 (수입 상위)</label>
        <input type="number" name="top_n" id="top-n-input" min="0" max="20" value="{{ top_n }}">
      </div>
      <div class="opt">
        <label class="field-label" for="candidates-input">관심 국가 (선택 · 쉼표로 구분)</label>
        <input type="text" name="candidates" id="candidates-input" placeholder="예: Vietnam, 태국, IDN" value="{{ candidates_raw }}">
      </div>
      <label class="opt-check">
        <input type="checkbox" name="force" value="1" {% if force %}checked{% endif %}> 🔄 저장된 결과 무시하고 새로 조사
      </label>
    </div>
    <p class="search-hint">앞 4자리 뒤에 마침표가 자동으로 찍히는 건 국제 표준 HS코드 표기 방식이고(예: 1905.90), 실제 조회 시에는 숫자만 사용됩니다.</p>
    <p class="loading-note" id="loading-note">⏳ 조사 중입니다. 저장된 결과가 없으면 UN Comtrade 호출 제한 때문에 몇 분 걸릴 수 있어요. 창을 닫지 말고 기다려 주세요.</p>
  </form>

  {% if matrix_error %}
    <div class="error">⚠️ {{ matrix_error }}</div>
  {% endif %}

  {% if result %}
    <div class="card item-card">
      <div class="item-meta">HS {{ result.hscode }} · 분석 기간 {{ result.years[0] }}~{{ result.years[-1] }} ·
        {% if result.from_cache %}저장된 결과 사용 ({{ result.fetched_at | kst }} 조회){% else %}방금 새로 조회함{% endif %}</div>
      {% if result.official_item_desc %}
        <div class="item-desc">📋 UN Comtrade 공식 품목 설명(HS {{ result.hscode }}): {{ item_desc_ko or result.official_item_desc }}</div>
        {% if item_desc_ko %}
          <div class="desc-original">원문: {{ result.official_item_desc }}</div>
          <div class="desc-note">※ 한국어는 AI 번역이라 관세청 공식 품목명과 표현이 다를 수 있습니다.</div>
        {% endif %}
      {% endif %}
    </div>

    <!-- ① + ② -->
    <div class="grid-2 row-gap" id="sec-world">
      <section class="card">
        <div class="card-head">
          <h3>① 세계시장 교역 순위
            <span class="info" tabindex="0">i<span class="info-pop">최신 연도 기준으로 이 품목을 가장 많이 수입(수출)한 상위 국가입니다.{% if overview and overview.years %} 조회 연도: {{ overview.years | join(', ') }} (최신 연도 {{ overview.years[-1] }} 기준 상위 {{ top_n or 10 }}개국){% endif %}</span></span>
          </h3>
          {% if overview and not overview.unavailable_reason %}
            <div class="flow-toggle" data-toggle-group="ranking">
              <button type="button" class="active" data-flow="import">수입</button>
              <button type="button" data-flow="export">수출</button>
            </div>
          {% endif %}
        </div>
        {% if overview and overview.unavailable_reason %}
          <div class="empty">세계시장 교역 현황을 가져오지 못했습니다 ({{ overview.unavailable_reason }}). 아래 다른 섹션에는 영향이 없습니다.</div>
        {% elif overview %}
          <div class="unit">단위: USD · {{ overview.years[-1] }}년 기준 상위 {{ top_n or 10 }}개국</div>
          <div class="flow-panel" data-flow-panel="ranking" data-flow="import">
            {{ hbar_chart(overview.import_ranking) }}
          </div>
          <div class="flow-panel hidden" data-flow-panel="ranking" data-flow="export">
            {{ hbar_chart(overview.export_ranking) }}
          </div>
          <div class="source">UN Comtrade 기준 · 막대에 마우스를 올리면 정확한 금액이 보입니다.</div>
        {% else %}
          <div class="empty">데이터 없음</div>
        {% endif %}
      </section>

      <section class="card">
        <div class="card-head">
          <h3>② 주요국 세계시장 점유율
            <span class="info" tabindex="0">i<span class="info-pop">{% if overview and overview.years %}세계 전체 {{ overview.years[-1] }}년 기준 {% endif %}상위 국가 + 한국을 강제 포함해서, 연도별로 "세계 시장 전체 대비 점유율"이 어떻게 변해왔는지 보여줍니다.</span></span>
          </h3>
          {% if overview and not overview.unavailable_reason and import_line and import_line.lines %}
            <div class="flow-toggle" data-toggle-group="trend">
              <button type="button" class="active" data-flow="import">수입</button>
              <button type="button" data-flow="export">수출</button>
            </div>
          {% endif %}
        </div>
        {% if overview and not overview.unavailable_reason and import_line and import_line.lines %}
          <div class="unit">단위: %</div>
          <div class="flow-panel" data-flow-panel="trend" data-flow="import">
            {% with chart = import_line %}{% include "exhibition/_un_line_chart.html" %}{% endwith %}
          </div>
          <div class="flow-panel hidden" data-flow-panel="trend" data-flow="export">
            {% with chart = export_line %}{% include "exhibition/_un_line_chart.html" %}{% endwith %}
          </div>
          <div class="source">UN Comtrade 기준</div>
        {% else %}
          <div class="empty">데이터 없음</div>
        {% endif %}
      </section>
    </div>

    <!-- ③ 유망시장 매트릭스 -->
    <section class="card" id="sec-matrix">
      <div class="card-head">
        <h3>③ 유망시장 매트릭스
          <span class="info" tabindex="0">i<span class="info-pop">X축 = 그 나라 수입시장 성장률(CAGR), Y축 = 한국 점유율, 버블 크기 = 수입금액(넓이 비례, 클수록 그 나라가 이 품목을 많이 수입함). 점선은 후보국 평균 기준선입니다. 버블을 클릭하면 수입 순위·금액 등 상세 수치가 뜹니다.</span></span>
        </h3>
        <span class="note"{% if result.comparison_too_small %} hidden{% endif %}>점선 = 평균 성장률 {{ result.thresholds.avg_cagr_pct }}% · 한국 점유율 기준 {{ (result.thresholds.share_threshold_pct if result.thresholds.share_threshold_pct is defined else result.thresholds.avg_korea_share_pct) | pct }}</span>
      </div>
      {% if result.comparison_too_small %}
        <div class="banner">ℹ️ 비교 국가가 {{ result.candidates | length }}개뿐이라 "평균보다 높다/낮다"로 나누는 사분면은 의미가 없어 표시하지 않았습니다. 사분면 비교를 보려면 비교 국가 수를 3 이상으로 해주세요.</div>
      {% elif result.korea_presence == 'negligible' %}
        <div class="banner">ℹ️ 이 품목은 모든 후보국에서 한국 점유율이 {{ result.thresholds.min_meaningful_share_pct }}% 미만이라, 한국이 아직 거의 수출하지 않는 품목입니다. 점유율 차이로 우열을 가리기보다 <strong>시장 규모와 성장성</strong> 위주로 보세요.</div>
      {% endif %}
      {% if matrix and matrix.points %}
        <div class="chart-scroll">
          <div class="matrix-canvas">
            <div class="plot" id="matrix-wrap">
              {% if not result.comparison_too_small %}
              <div class="quad-bg q-bg-tl" style="left:0; top:0; width:{{ matrix.threshold_x_pct }}%; height:{{ matrix.threshold_y_pct }}%;"></div>
              <div class="quad-bg q-bg-tr" style="left:{{ matrix.threshold_x_pct }}%; right:0; top:0; height:{{ matrix.threshold_y_pct }}%;"></div>
              <div class="quad-bg q-bg-bl" style="left:0; bottom:0; width:{{ matrix.threshold_x_pct }}%; top:{{ matrix.threshold_y_pct }}%;"></div>
              <div class="quad-bg q-bg-br" style="left:{{ matrix.threshold_x_pct }}%; right:0; bottom:0; top:{{ matrix.threshold_y_pct }}%;"></div>
              {% endif %}

              {% for t in matrix.y_ticks %}
                <div class="y-tick" style="top: {{ t.pct }}%;">{{ t.value }}%</div>
              {% endfor %}
              {% for t in matrix.x_ticks %}
                <div class="x-tick" style="left: {{ t.pct }}%;">{{ t.value }}%</div>
              {% endfor %}

              <span class="axis-title-y">↑ 한국 점유율(%)</span>
              <span class="axis-title-x">수입시장 성장률 CAGR(%) →</span>
              {% if not result.comparison_too_small %}
              <div class="axis-line h" style="top: {{ matrix.threshold_y_pct }}%;"></div>
              <div class="axis-line v" style="left: {{ matrix.threshold_x_pct }}%;"></div>
              {% endif %}

              {% for q in matrix.quadrants %}
                {% if q.pos == 'tl' %}{% set qpos = 'left:8px; top:8px;' %}
                {% elif q.pos == 'tr' %}{% set qpos = 'right:8px; top:8px;' %}
                {% elif q.pos == 'bl' %}{% set qpos = 'left:8px; bottom:8px;' %}
                {% else %}{% set qpos = 'right:8px; bottom:8px;' %}{% endif %}
                {% if not result.comparison_too_small %}<span class="quadrant-tag {{ q.css }}" style="{{ qpos }}">{{ q.label }}</span>{% endif %}
              {% endfor %}

              {% for b in matrix.points | sort(attribute='bubble_radius', reverse=true) %}
                <div class="bubble{{ ' focus' if b.is_focus }}"
                     style="left: {{ b.x_pct }}%; top: {{ b.y_pct }}%; width: {{ b.bubble_radius * 2 }}px; height: {{ b.bubble_radius * 2 }}px;"
                     data-label="{{ b.label }}"
                     data-focus="{{ 'true' if b.is_focus else '' }}"
                     data-quadrant="{{ b.quadrant or '' }}"
                     data-cagr="{{ b.cagr_pct }}"
                     data-share="{{ b.korea_share_pct }}"
                     data-rank="{{ b.import_rank or '' }}"
                     data-import="{{ (b.total_import_usd | round | int) if b.total_import_usd else '' }}"
                     data-korea="{{ (b.korea_import_usd | round | int) if b.korea_import_usd is not none else '' }}"
                     data-suppliers="{{ b.supplier_country_count if b.supplier_country_count is not none else '' }}"
                     data-mirror="{{ 'true' if b.is_mirror_estimate else '' }}"
                ></div>
                <div class="bubble-label{{ ' focus' if b.is_focus }}" style="left: {{ b.x_pct }}%; top: calc({{ b.y_pct }}% + {{ b.bubble_radius + 3 }}px);">{{ '★ ' if b.is_focus }}{{ b.label }}</div>
              {% endfor %}
              <div class="bubble-detail" id="bubble-detail"></div>
            </div>
          </div>
        </div>
        <div class="chart-legend">
          <span><i style="background:#3fa2f7"></i>버블 크기 = 품목 총 수입금액</span>
          {% if result.focus_count %}<span><i style="background:#f08c00"></i>★ 관심 국가</span>{% endif %}
        </div>
        <p class="note">위로 갈수록 한국이 이미 선전 중인 시장 · 오른쪽으로 갈수록 시장이 빠르게 크고 있음 · 버블이 클수록 큰 시장</p>
      {% else %}
        <div class="empty">매트릭스를 그릴 데이터가 부족합니다.</div>
      {% endif %}
    </section>

    <!-- ④ 후보국별 상세 -->
    <section class="card" id="sec-candidates">
      <div class="card-head">
        <h3>④ 비교 국가별 상세
          <span class="info" tabindex="0">i<span class="info-pop">🪞 표시는 그 나라가 UN Comtrade에 직접 보고한 공식 수치가 없어서, 상대국들의 보고를 합산한 추정치를 대신 쓴 경우입니다.</span></span>
        </h3>
      </div>
      {% if result.korea_presence == 'negligible' %}
        <div class="banner">ℹ️ 한국 점유율이 모든 후보국에서 {{ result.thresholds.min_meaningful_share_pct }}% 미만입니다 (한국 수출 실적이 미미한 품목).</div>
      {% endif %}
      <div class="tbl-wrap">
        <table class="tbl">
          <tr>
            <th>국가</th><th>사분면</th><th>수입 성장률(CAGR)</th><th>한국 점유율</th>
            <th>시장 규모<br><span class="sub-num">전체 수입액</span></th>
            <th>한국산 수입액<br><span class="sub-num">상대국 신고 기준</span></th>
            <th>한국 수출액<br><span class="sub-num">관세청 기준</span></th>
            <th>1위 공급국 · 참고</th>
          </tr>
          {% for c in result.candidates %}
            {% set share = (c.korea_import_usd / c.total_import_usd * 100) if (c.korea_import_usd is not none and c.total_import_usd) else c.korea_share_pct %}
            <tr class="{{ 'focus' if c.is_focus }}">
              <td class="left">
                {% if c.is_focus %}<span class="star" title="관심 국가">★</span> {% endif %}{{ c.label }}{% if c.is_mirror_estimate %} <span class="badge mirror" title="상대국 보고 기반 추정치">🪞</span>{% endif %}
                {% if c.data_year %}<span class="sub-num">{{ c.data_year }}년 기준</span>{% endif %}
              </td>
              <td>{% if c.quadrant %}<span class="quadrant-badge quadrant-{{ c.quadrant | replace(' ', '') | replace('/', '') }}">{{ c.quadrant }}</span>{% else %}<span class="sub-num">-</span>{% endif %}</td>
              <td class="num">{{ c.cagr_pct }}%{% if c.cagr_start_year %}<span class="sub-num">{{ c.cagr_start_year }}→{{ c.cagr_end_year }}</span>{% endif %}</td>
              <td class="num">{{ share | pct }}
                {% if c.korea_rank %}<span class="sub-num">한국 {{ c.korea_rank }}위 공급국</span>
                {% elif c.korea_import_usd == 0 %}<span class="sub-num">한국산 수입 기록 없음</span>{% endif %}
              </td>
              <td class="num" title="${{ '{:,.0f}'.format(c.total_import_usd) if c.total_import_usd else 'N/A' }}">{{ money(c.total_import_usd) }}
                {% if c.is_small_market %}<span class="sub-num" style="color:var(--warn)">소규모 · 변동성 큼</span>{% endif %}
              </td>
              <td class="num" title="{{ '$' ~ '{:,.0f}'.format(c.korea_import_usd) if c.korea_import_usd is not none else '데이터 없음' }}">{{ money(c.korea_import_usd) }}</td>
              {% set ce = c.korea_export_customs_usd %}
              <td class="num" title="{{ ('$' ~ '{:,.0f}'.format(ce)) if ce is not none else (c.customs_note or '관세청 자료 없음') }}">
                {% if ce is none %}<span class="sub-num">-</span>{% else %}{{ money(ce) }}{% endif %}
              </td>
              <td>
                {% if c.may_be_incomplete_latest_year %}<span class="badge warn" title="최신 연도 값이 직전 연도보다 30% 이상 급감해 CAGR 계산에서 뺐습니다">⚠️ 최신연도 급감</span>{% endif %}
                {% if c.top_supplier %}<span class="sub-num">1위 공급국: {{ c.top_supplier.label }} ({{ c.top_supplier.share_pct | pct }})</span>{% endif %}
              </td>
            </tr>
          {% endfor %}
        </table>
      </div>
      <p class="note">한국산 수입액은 상대국이 신고한 값(CIF), 한국 수출액은 한국 관세청 집계(FOB)라 기준이 달라 조금 다를 수 있습니다.</p>
      {% if result.excluded %}
        <p class="note">⚠️ 비교에서 제외된 국가:
          {% for e in result.excluded %}<strong>{{ e.label }}</strong> ({{ e.reason }}){% if not loop.last %}, {% endif %}{% endfor %}
        </p>
      {% endif %}
    </section>

    <!-- ⑤ AI 분석 -->
    <section class="card" id="sec-ai">
      <div class="card-head">
        <h3>⑤ AI 분석
          <span class="info" tabindex="0">i<span class="info-pop">위 매트릭스 수치를 바탕으로 한 AI 해석입니다. 실제 전략 결정 전 추가 검증을 권장합니다.</span></span>
        </h3>
      </div>
      <div class="ai-sub">UN Comtrade · 관세청 통계 기반</div>
      {% if result.ai_summary %}
        {% set ai = result.ai_summary %}
        <div class="ai-box">
          {% if ai.key_findings %}
          <div><span class="ai-label">핵심 사실</span>
            <ul class="ai-list">{% for f in ai.key_findings %}<li>{{ f }}</li>{% endfor %}</ul>
          </div>
          {% endif %}
          <div><span class="ai-label">우선 공략 후보</span>
            <ul class="ai-list">
              {% for m in ai.top_priority_markets or [] %}<li><strong>{{ m.label }}</strong> — {{ m.reason }}</li>{% endfor %}
            </ul>
          </div>
          {% if ai.watch_markets %}
          <div><span class="ai-label">지켜볼 시장</span>
            <ul class="ai-list">{% for m in ai.watch_markets %}<li><strong>{{ m.label }}</strong> — {{ m.reason }}</li>{% endfor %}</ul>
          </div>
          {% endif %}
          <div><span class="ai-label">종합 전략</span>{{ ai.overall_strategy }}</div>
        </div>
      {% else %}
        <div class="ai-box empty">AI 해석 생성에 실패했습니다 (위 원본 수치는 그대로 유효합니다).
          {% if result.ai_error %}<div class="ai-error">원인: {{ result.ai_error }}</div>{% endif %}
        </div>
      {% endif %}
    </section>
  {% endif %}
</div>

<script>
(function () {
  var input = document.getElementById('hscode-input');
  if (!input) return;
  input.addEventListener('input', function () {
    var digits = this.value.replace(/\D/g, '').slice(0, 6);
    this.value = digits.length > 4 ? digits.slice(0, 4) + '.' + digits.slice(4) : digits;
  });
})();

document.querySelectorAll('.un-page .flow-toggle').forEach(function (group) {
  var name = group.dataset.toggleGroup;
  group.querySelectorAll('button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      group.querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      document.querySelectorAll('[data-flow-panel="' + name + '"]').forEach(function (panel) {
        panel.classList.toggle('hidden', panel.dataset.flow !== btn.dataset.flow);
      });
    });
  });
});

function setLoading() {
  var btn = document.getElementById('submit-btn');
  if (btn) { btn.disabled = true; btn.textContent = '분석 중...'; }
  var note = document.getElementById('loading-note');
  if (note) note.classList.add('show');
}
document.getElementById('main-form').addEventListener('submit', setLoading);

var bubbleWrap = document.getElementById('matrix-wrap');
var bubbleDetail = document.getElementById('bubble-detail');
function hideBubbleDetail() {
  if (!bubbleWrap) return;
  bubbleDetail.style.display = 'none';
  bubbleWrap.querySelectorAll('.bubble').forEach(function (b) { b.classList.remove('selected'); });
}
function addRow(parent, label, value) {
  var row = document.createElement('div');
  row.className = 'bd-row';
  var l = document.createElement('span');
  l.textContent = label;
  var v = document.createElement('b');
  v.textContent = value;
  row.appendChild(l);
  row.appendChild(v);
  parent.appendChild(row);
}
function fmtPct(v) {
  var n = Number(v);
  if (isNaN(n)) return 'N/A';
  if (n === 0) return '0%';
  if (Math.abs(n) < 0.01) return '<0.01%';
  if (Math.abs(n) < 1) return n.toFixed(2) + '%';
  return n.toFixed(1) + '%';
}
if (bubbleWrap) {
  var money2 = function (n) { return n ? '$' + Number(n).toLocaleString() : 'N/A'; };
  bubbleWrap.querySelectorAll('.bubble').forEach(function (bubble) {
    bubble.addEventListener('click', function (e) {
      e.stopPropagation();
      hideBubbleDetail();
      bubble.classList.add('selected');
      var d = bubble.dataset;
      bubbleDetail.innerHTML = '';

      var title = document.createElement('div');
      title.className = 'bd-title';
      title.textContent = (d.rank ? d.rank + '위. ' : '') + d.label;
      bubbleDetail.appendChild(title);
      if (d.quadrant) {
        var q = document.createElement('span');
        q.className = 'bd-q';
        q.textContent = d.quadrant;
        bubbleDetail.appendChild(q);
      }
      if (d.mirror) {
        var m = document.createElement('div');
        m.textContent = '🪞 상대국 보고 기반 추정치';
        bubbleDetail.appendChild(m);
      }
      addRow(bubbleDetail, '품목 수입금액', money2(d.import));
      addRow(bubbleDetail, '한국산 수입금액', money2(d.korea));
      addRow(bubbleDetail, '수입 성장률(CAGR)', d.cagr + '%');
      addRow(bubbleDetail, '한국 점유율', fmtPct(d.share));
      if (d.suppliers) addRow(bubbleDetail, d.label + '의 수입 공급국 수', d.suppliers + '개국');

      var left = parseFloat(bubble.style.left);
      var top = parseFloat(bubble.style.top);
      bubbleDetail.style.left = (left > 60 ? left - 32 : left + 4) + '%';
      bubbleDetail.style.top = Math.min(Math.max(top - 10, 0), 48) + '%';
      bubbleDetail.style.display = 'block';
    });
  });

  (function declutterLabels() {
    var labels = Array.prototype.slice.call(bubbleWrap.querySelectorAll('.bubble-label'));
    labels.forEach(function (l) { l.dataset.shift = '0'; });
    for (var pass = 0; pass < 10; pass++) {
      var moved = false;
      for (var i = 0; i < labels.length; i++) {
        for (var j = i + 1; j < labels.length; j++) {
          var a = labels[i].getBoundingClientRect();
          var b = labels[j].getBoundingClientRect();
          var overlap = a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom;
          if (!overlap) continue;
          var lower = a.top <= b.top ? labels[j] : labels[i];
          var upperRect = a.top <= b.top ? a : b;
          var lowerRect = a.top <= b.top ? b : a;
          var shift = Number(lower.dataset.shift) + (upperRect.bottom - lowerRect.top) + 1;
          lower.dataset.shift = String(shift);
          lower.style.transform = 'translate(-50%, ' + shift + 'px)';
          moved = true;
        }
      }
      if (!moved) break;
    }
  })();

  document.addEventListener('click', function (e) {
    if (bubbleDetail && bubbleDetail.contains(e.target)) return;
    hideBubbleDetail();
  });
}
</script>
{% endblock %}

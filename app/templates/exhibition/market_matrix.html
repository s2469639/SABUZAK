{% extends "base.html" %}
{% block title %}시장 매트릭스 비교 | 사부작{% endblock %}

{% block content %}
{# un_v6/templates/un_comtrade_matrix.html 내용을 그대로 이식 (KOTRA TriBig
   "품목별 유망시장" 화면 구조). 하드코딩된 <style>은 style.css의
   ".un-matrix ..." 규칙으로 옮기고, 마크업/로직/문구는 그대로 유지했다. #}
<div class="page-header">
  <div>
    <h1>시장 매트릭스 비교</h1>
    <p class="page-desc">HS코드 하나로 여러 후보국의 세계시장 순위·점유율 추이·유망시장 순위·성장률x한국점유율 매트릭스를 한 번에 봅니다.</p>
  </div>
  <a href="{{ url_for('dashboard.index') }}" class="btn-secondary">← 대시보드로</a>
</div>

<div class="card un-matrix">
<form method="post" class="un-matrix-form">
  <div>
    <span class="un-field-label">HS코드(6자리)</span>
    <input type="text" name="hscode" id="hscode-input" placeholder="예: 1905.90" value="{{ hscode }}" maxlength="7" required>
  </div>
  <div>
    <span class="un-field-label">후보국 (쉼표로 구분, 비워두면 자동)</span>
    <input type="text" name="candidates" placeholder="예: Vietnam, Thailand, VNM (비워두면 상위 N개국 자동)" value="{{ candidates_raw }}">
  </div>
  <div>
    <span class="un-field-label">자동 후보 개수</span>
    <input type="number" name="top_n" min="2" max="20" value="{{ top_n }}">
  </div>
  <label class="checkbox-inline un-matrix-force">
    <input type="checkbox" name="force" value="1" {% if force %}checked{% endif %}> 🔄 캐시 무시하고 새로 조사
  </label>
  <button type="submit" class="btn-primary">비교하기</button>
</form>
<p class="placeholder-note">앞 4자리 뒤에 마침표가 자동으로 찍히는 건 국제 표준 HS코드 표기 방식이고(예: 1905.90), 실제 조회 시에는 숫자만 사용됩니다.</p>
</div>

{% if error %}
<p class="placeholder-note un-error">⚠️ {{ error }}</p>
{% endif %}

{% if result %}
<p class="page-desc">HS {{ result.hscode }} · 매트릭스 조회 연도: {{ result.years | join(', ') }} · 캐시 사용: {{ result.from_cache }}</p>

{% if result.official_item_desc %}
<p class="placeholder-note un-item-desc">📋 UN Comtrade 공식 품목 설명(HS {{ result.hscode }}): {{ result.official_item_desc }}</p>
{% endif %}

<div class="card">
<h2 class="section-label">① 세계시장 교역 현황</h2>
{% if overview and overview.unavailable_reason %}
  <p class="placeholder-note">세계시장 교역 현황을 가져오지 못했습니다 ({{ overview.unavailable_reason }}). 아래 다른 섹션에는 영향이 없습니다.</p>
{% elif overview %}
  <p class="placeholder-note">조회 연도: {{ overview.years | join(', ') }} (최신 연도 {{ overview.years[-1] }} 기준 상위 {{ top_n }}개국)</p>
  <div class="un-flow-toggle" data-toggle-group="ranking">
    <button type="button" class="active" data-flow="import">수입</button>
    <button type="button" data-flow="export">수출</button>
  </div>
  <div class="un-flow-panel" data-flow-panel="ranking" data-flow="import">
    <table class="un-table">
      <tr><th>#</th><th>국가</th><th>수입액(USD)</th></tr>
      {% for r in overview.import_ranking %}
      <tr><td>{{ loop.index }}</td><td>{{ r.country }}</td><td>${{ "{:,.0f}".format(r.value_usd) }}</td></tr>
      {% endfor %}
    </table>
  </div>
  <div class="un-flow-panel un-hidden" data-flow-panel="ranking" data-flow="export">
    <table class="un-table">
      <tr><th>#</th><th>국가</th><th>수출액(USD)</th></tr>
      {% for r in overview.export_ranking %}
      <tr><td>{{ loop.index }}</td><td>{{ r.country }}</td><td>${{ "{:,.0f}".format(r.value_usd) }}</td></tr>
      {% endfor %}
    </table>
  </div>
{% else %}
  <p class="placeholder-note">데이터 없음</p>
{% endif %}
</div>

<div class="card">
<h2 class="section-label">② 주요국 세계시장 점유율 추이</h2>
{% if overview and not overview.unavailable_reason and import_line and import_line.lines %}
  <p class="placeholder-note">세계 전체 {{ overview.years[-1] }}년 기준 상위 국가 + 한국을 강제 포함해서, 연도별로 "세계 시장 전체 대비 점유율"이 어떻게 변해왔는지 보여줍니다.</p>
  <div class="un-flow-toggle" data-toggle-group="trend">
    <button type="button" class="active" data-flow="import">수입 기준</button>
    <button type="button" data-flow="export">수출 기준</button>
  </div>
  <div class="un-flow-panel" data-flow-panel="trend" data-flow="import">
    {% with chart = import_line %}{% include "exhibition/_un_line_chart.html" %}{% endwith %}
  </div>
  <div class="un-flow-panel un-hidden" data-flow-panel="trend" data-flow="export">
    {% with chart = export_line %}{% include "exhibition/_un_line_chart.html" %}{% endwith %}
  </div>
{% else %}
  <p class="placeholder-note">데이터 없음</p>
{% endif %}
</div>

<div class="card">
<h2 class="section-label">③ 유망시장 순위</h2>
<p class="placeholder-note">
  버블 크기 = 수입금액(넓이 비례, 클수록 그 나라가 이 품목을 많이 수입함). 버블을 클릭하면 상세 수치가 뜹니다.
  ⚠️ X축 순위는 "수입금액이 큰 순"으로 단순 계산한 것입니다.
</p>
{% if bubbles %}
  <div class="un-chart-frame">
    <div class="un-axis-title-y">Y축: 공급국 다양성 (이 나라가 이 품목을 몇 개국에서 수입해오는가, 개국) — 위로 갈수록 공급국이 많고 시장이 분산돼 있음</div>
    <div class="un-bubble-wrap" id="bubble-wrap">
      {% for b in bubbles %}
        <div class="un-bubble" data-idx="{{ loop.index0 }}"
             style="left: {{ b.x_pct }}%; top: {{ b.y_pct }}%; width: {{ b.bubble_radius * 2 }}px; height: {{ b.bubble_radius * 2 }}px;"
             data-label="{{ b.label }}"
             data-rank="{{ b.import_rank }}"
             data-import="{{ b.total_import_usd | round | int }}"
             data-korea="{{ (b.korea_import_usd | round | int) if b.korea_import_usd else '' }}"
             data-suppliers="{{ b.supplier_country_count }}"
             data-mirror="{{ 'true' if b.is_mirror_estimate else '' }}"
             data-href="{{ url_for('exhibition.market_matrix') }}?hscode={{ result.hscode }}"
        ></div>
        <div class="un-bubble-label" style="left: {{ b.x_pct }}%; top: {{ b.y_pct + 6 }}%;">{{ b.label }}</div>
      {% endfor %}
      <div class="un-bubble-detail" id="bubble-detail"></div>
    </div>
  </div>
  <div class="un-axis-title-x">X축: 수입금액 순위 (1위 = 이 품목을 전세계에서 가장 많이 수입하는 나라) — 오른쪽으로 갈수록 순위가 낮은(수입액이 적은) 나라</div>
{% else %}
  <p class="placeholder-note">버블차트를 그릴 데이터가 부족합니다.</p>
{% endif %}
</div>

<div class="card">
<h2 class="section-label">④ 성장률 x 한국 점유율 매트릭스</h2>
<p class="placeholder-note">
  점선은 후보국 평균 기준선입니다 (성장률 평균 {{ result.thresholds.avg_cagr_pct }}%,
  한국 점유율 평균 {{ result.thresholds.avg_korea_share_pct }}%). 오른쪽 위로 갈수록
  "시장도 크고 한국도 잘하고 있는" 시장입니다.
</p>
<div class="un-chart-frame">
  <div class="un-axis-title-y">Y축: 그 나라 수입시장에서 한국의 점유율 (%) — 위로 갈수록 한국이 이미 선전 중인 시장</div>
  <div class="un-scatter-wrap">
    <div class="un-axis-line un-h" style="top: {{ threshold_y_pct }}%;"></div>
    <div class="un-axis-line un-v" style="left: {{ threshold_x_pct }}%;"></div>
    <span class="un-quadrant-tag" style="right:6px; top:6px;">집중 공략 ↗</span>
    <span class="un-quadrant-tag" style="left:6px; top:6px;">경쟁력 강화 필요</span>
    <span class="un-quadrant-tag" style="right:6px; bottom:6px;">현상 유지/수확</span>
    <span class="un-quadrant-tag" style="left:6px; bottom:6px;">우선순위 낮음</span>
    {% for c in scatter %}
      <div class="un-dot" style="left: {{ c.x_pct }}%; top: {{ c.y_pct }}%;" title="{{ c.label }}: 성장률 {{ c.cagr_pct }}%, 한국점유율 {{ c.korea_share_pct }}%"></div>
      <div class="un-dot-label" style="left: {{ c.x_pct }}%; top: {{ c.y_pct }}%;">{{ c.label }}</div>
    {% endfor %}
  </div>
</div>
<div class="un-axis-title-x">X축: 그 나라 수입시장 성장률 (CAGR, 연평균 %) — 오른쪽으로 갈수록 시장이 빠르게 크고 있음</div>
</div>

<div class="card">
<h2 class="section-label">⑤ 후보국별 상세</h2>
<p class="placeholder-note">🪞 표시는 그 나라가 UN Comtrade에 직접 보고한 공식 수치가 없어서, 상대국들의 보고를 합산한 추정치를 대신 쓴 경우입니다.</p>
<table class="un-table">
  <tr><th>국가</th><th>사분면</th><th>수입 성장률(CAGR)</th><th>한국 점유율</th><th>전체 수입액(최근)</th><th>한국 수입액(최근)</th><th></th></tr>
  {% for c in result.candidates %}
  <tr>
    <td>{{ c.label }}{% if c.is_mirror_estimate %} <span title="상대국 보고 기반 추정치">🪞</span>{% endif %}</td>
    <td><span class="un-quadrant-badge un-quadrant-{{ c.quadrant | replace(' ', '') | replace('/', '') }}">{{ c.quadrant }}</span></td>
    <td>{{ c.cagr_pct }}%</td>
    <td>{{ c.korea_share_pct }}%</td>
    <td>${{ "{:,.0f}".format(c.total_import_usd) if c.total_import_usd else "N/A" }}</td>
    <td>${{ "{:,.0f}".format(c.korea_import_usd) if c.korea_import_usd else "N/A" }}</td>
    <td>{% if c.may_be_incomplete_latest_year %}<span class="placeholder-note">⚠️ 최신연도 집계중일 수 있음</span>{% endif %}</td>
  </tr>
  {% endfor %}
</table>

{% if result.excluded %}
<p class="placeholder-note">⚠️ 데이터 부족으로 매트릭스에서 제외된 후보: {% for e in result.excluded %}{{ e.label }}{% if not loop.last %}, {% endif %}{% endfor %}</p>
{% endif %}
</div>

<div class="card">
<h2 class="section-label">⑥ AI 전략 시사점</h2>
<p class="placeholder-note">위 매트릭스 수치를 바탕으로 한 AI 해석입니다. 실제 전략 결정 전 추가 검증을 권장합니다.</p>
{% if result.ai_summary %}
<div class="un-insight-box">
  <div><span class="un-insight-label">우선 공략 후보</span>
    {% for m in result.ai_summary.top_priority_markets %}{{ m.label }} ({{ m.reason }}){% if not loop.last %}; {% endif %}{% endfor %}
  </div>
  <div><span class="un-insight-label">종합 전략</span>{{ result.ai_summary.overall_strategy }}</div>
</div>
{% else %}
<p class="placeholder-note">AI 해석 생성에 실패했습니다 (위 원본 수치는 그대로 유효합니다).</p>
{% endif %}
</div>
{% endif %}

<script>
(function () {
  var input = document.getElementById('hscode-input');
  if (!input) return;
  input.addEventListener('input', function () {
    var digits = this.value.replace(/\D/g, '').slice(0, 6);
    this.value = digits.length > 4 ? digits.slice(0, 4) + '.' + digits.slice(4) : digits;
  });
})();

document.querySelectorAll('.un-flow-toggle').forEach(function (group) {
  var name = group.dataset.toggleGroup;
  group.querySelectorAll('button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      group.querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      document.querySelectorAll('[data-flow-panel="' + name + '"]').forEach(function (panel) {
        panel.classList.toggle('un-hidden', panel.dataset.flow !== btn.dataset.flow);
      });
    });
  });
});

(function () {
  var wrap = document.getElementById('bubble-wrap');
  if (!wrap) return;
  var detail = document.getElementById('bubble-detail');
  var fmt = function (n) { return n === '' || n === undefined ? 'N/A' : '$' + Number(n).toLocaleString(); };

  wrap.querySelectorAll('.un-bubble').forEach(function (bubble) {
    bubble.addEventListener('click', function () {
      wrap.querySelectorAll('.un-bubble').forEach(function (b) { b.classList.remove('selected'); });
      bubble.classList.add('selected');

      var d = bubble.dataset;
      detail.innerHTML =
        '<strong>' + d.rank + '위. ' + d.label + '</strong>' +
        (d.mirror ? '🪞 상대국 보고 기반 추정치<br>' : '') +
        '품목 수입금액(USD): ' + fmt(d.import) + '<br>' +
        '한국 수출금액(USD): ' + fmt(d.korea) + '<br>' +
        '해당품목 수입국가 수: ' + d.suppliers + '개국<br>' +
        '<a href="' + d.href + '">이 HS코드로 다시 비교하기 →</a>';

      var left = parseFloat(bubble.style.left);
      var top = parseFloat(bubble.style.top);
      detail.style.left = (left > 60 ? left - 22 : left + 4) + '%';
      detail.style.top = Math.max(top - 4, 4) + '%';
      detail.style.display = 'block';
    });
  });

  document.addEventListener('click', function (e) {
    if (!wrap.contains(e.target)) {
      detail.style.display = 'none';
      wrap.querySelectorAll('.un-bubble').forEach(function (b) { b.classList.remove('selected'); });
    }
  });
})();
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}대시보드 | 사부작{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>박람회 대시보드</h1>
    <p class="page-desc">권역을 선택하면 해당 권역의 박람회 목록으로 이동합니다 (지도는 추후 추가 예정)</p>
  </div>
</div>

<div class="country-select-bar">
  <label for="country-select">국가로 바로 찾기</label>
  <select id="country-select" onchange="if (this.value) { window.location.href = this.value; }">
    <option value="">국가 선택...</option>
    {% for country in countries %}
    <option value="{{ url_for('exhibition.expo_list_by_country', country=country) }}">{{ country }}</option>
    {% endfor %}
  </select>
</div>

<div class="continent-grid">
  {% for continent in continents %}
  <a href="{{ url_for('exhibition.expo_list', continent=continent) }}" class="continent-card">
    <span class="continent-name">{{ continent }}</span>
    <span class="continent-count">{{ counts.get(continent, 0) }}개 박람회</span>
  </a>
  {% endfor %}
</div>
{% endblock %}

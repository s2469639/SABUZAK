<div class="tab-nav">
  <div class="tab-nav-buttons">
    <a href="{{ url_for('contacts.list_contacts') }}"
       class="tab-btn {{ 'active' if request.endpoint and request.endpoint.startswith('contacts.') else '' }}">바이어 목록</a>
    <a href="{{ url_for('mail_template.home') }}"
       class="tab-btn {{ 'active' if request.endpoint and request.endpoint.startswith('mail_template.') else '' }}">메일 템플릿</a>
    <a href="{{ url_for('buyer_profile.edit_profile') }}"
       class="tab-btn {{ 'active' if request.endpoint == 'buyer_profile.edit_profile' else '' }}">발신 정보</a>
  </div>
  {% if current_user.google_refresh_token %}
  <div class="buyer-mail-gmail-connected">
    <span class="buyer-mail-gmail-status">Gmail 연동됨 ({{ current_user.google_email }})</span>
    <form method="post" action="{{ url_for('buyer_gmail.disconnect') }}" onsubmit="return confirm('Gmail 발송 연동을 해제할까요?');">
      <button type="submit" class="btn-chip">연동 해제</button>
    </form>
  </div>
  {% else %}
  <a href="{{ url_for('buyer_gmail.connect') }}" class="btn-chip">Gmail 발송 연동</a>
  {% endif %}
</div>

{% if current_user.is_authenticated %}
<div class="chatbot-widget" id="chatbot-widget">
  <button type="button" class="chatbot-fab" id="chatbot-fab" aria-label="챗봇 열기">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M12 3C7 3 3 6.4 3 10.5c0 2.3 1.3 4.4 3.3 5.8-.1.9-.4 2.1-1.1 3.2-.1.2.1.5.4.4 1.7-.5 3-1.2 3.7-1.7.9.2 1.8.3 2.7.3 5 0 9-3.4 9-7.5S17 3 12 3z" fill="currentColor"/>
    </svg>
  </button>

  <div class="chatbot-panel" id="chatbot-panel" hidden>
    <div class="chatbot-panel-header">
      <span>FairMate 도우미</span>
      <button type="button" id="chatbot-close" aria-label="닫기">✕</button>
    </div>

    <div class="chatbot-messages" id="chatbot-messages">
      <div class="chatbot-msg chatbot-msg-bot">
        안녕하세요! FairMate 사용법이나 제품 HS코드가 궁금하시면 물어보세요 🙂
      </div>
    </div>

    <div class="chatbot-examples" id="chatbot-examples">
      <button type="button" class="chatbot-example-btn">이 웹사이트는 어떻게 써?</button>
      <button type="button" class="chatbot-example-btn">유과 HS코드 알려줘</button>
      <button type="button" class="chatbot-example-btn">부스 컨셉 기획은 어디서 해?</button>
    </div>

    <form class="chatbot-input-row" id="chatbot-form">
      <input type="text" id="chatbot-input" placeholder="궁금한 점을 입력하세요" autocomplete="off">
      <button type="submit" aria-label="전송">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </div>
</div>
{% endif %}

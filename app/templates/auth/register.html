{% extends "base.html" %}
{% block title %}회원가입 | 사부작{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <h1>사부작 회원가입</h1>

  <form method="post" action="{{ url_for('auth.register') }}">
    <label for="name">이름</label>
    <input type="text" id="name" name="name" value="{{ name or '' }}" required autofocus>

    <label for="company">회사명</label>
    <input type="text" id="company" name="company" value="{{ company or '' }}">

    <label for="email">이메일</label>
    <input type="email" id="email" name="email" value="{{ email or '' }}" required>

    <label for="password">비밀번호</label>
    <input type="password" id="password" name="password" required>

    <label for="password_confirm">비밀번호 확인</label>
    <input type="password" id="password_confirm" name="password_confirm" required>

    <button type="submit">가입하기</button>
  </form>

  <p class="auth-switch">
    이미 계정이 있으신가요? <a href="{{ url_for('auth.login') }}">로그인</a>
  </p>
</div>
{% endblock %}

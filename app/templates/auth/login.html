{% extends "auth_base.html" %}
{% block title %}로그인 | FairMate{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-logo">
    <div class="auth-logo-badge">{% include "_logo_icon.html" %}</div>
    <h1>FairMate</h1>
    <p class="auth-logo-sub">박람회 준비 대시보드</p>
  </div>

  <form method="post" action="{{ url_for('auth.login') }}" class="auth-form">
    <label for="email">이메일</label>
    <input type="email" id="email" name="email" value="{{ email or '' }}" required autofocus>

    <label for="password">비밀번호</label>
    <input type="password" id="password" name="password" required>

    <label class="checkbox">
      <input type="checkbox" name="remember"> 로그인 상태 유지
    </label>

    <button type="submit" class="btn-primary auth-submit">로그인</button>
  </form>

  <p class="auth-switch">
    계정이 없으신가요? <a href="{{ url_for('auth.register') }}">회원가입</a>
  </p>
</div>
{% endblock %}

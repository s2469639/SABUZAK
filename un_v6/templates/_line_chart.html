{# 주요국 세계시장 점유율 추이 SVG 라인차트 #}
{% if chart and chart.lines %}
  <style>
    .line-chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 8px;
      font-size: 13px;
      color: #444;
    }
    .line-chart-legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .line-chart-legend .swatch {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: inline-block;
    }
    .axis-label-svg {
      font-size: 11px;
      fill: #666;
      font-family: sans-serif;
    }
  </style>
  <div class="line-chart-legend">
    {% for line in chart.lines %}
      <span><span class="swatch" style="background: {{ line.color }};"></span>{{ line.label }}</span>
    {% endfor %}
  </div>
  <div style="width: 100%; background: #fafafa; border: 1px solid #ddd; border-radius: 8px; padding: 12px; box-sizing: border-box;">
    <svg width="100%" height="260" viewBox="0 0 {{ chart.width }} {{ chart.height }}" preserveAspectRatio="none" style="display: block;">
      {% for i in range(4) %}
        {% set gy = chart.pad_t + chart.plot_h * i / 3 %}
        <line x1="{{ chart.pad_l }}" y1="{{ gy }}" x2="{{ chart.pad_l + chart.plot_w }}" y2="{{ gy }}" stroke="#e0e0e0" stroke-width="1"></line>
        <text x="{{ chart.pad_l - 8 }}" y="{{ gy + 4 }}" text-anchor="end" class="axis-label-svg">{{ (chart.y_max * (3 - i) / 3) | round(1) }}%</text>
      {% endfor %}
      {% for lbl in chart.x_labels %}
        <text x="{{ lbl.x }}" y="{{ chart.height - 6 }}" text-anchor="middle" class="axis-label-svg">{{ lbl.year }}</text>
      {% endfor %}
      {% for line in chart.lines %}
        <polyline points="{{ line.points }}" fill="none" stroke="{{ line.color }}" stroke-width="2.5"></polyline>
        {% for pt in line.coords %}
          <circle cx="{{ pt.x }}" cy="{{ pt.y }}" r="3.5" fill="{{ line.color }}">
            <title>{{ line.label }} {{ pt.year }}년: {{ pt.share_pct }}%</title>
          </circle>
        {% endfor %}
      {% endfor %}
    </svg>
  </div>
{% else %}
  <div class="empty">데이터 없음</div>
{% endif %}
